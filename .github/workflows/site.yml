name: 사이트 배포와 KSPO API 재검사

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * 0'   # 매주 월요일 오전 6시 17분(한국 시간)
  workflow_dispatch:         # Actions 탭에서 직접 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: KSPO API 재검사
        if: github.event_name != 'push'
        env:
          KCISA_KEY_LINKED: ${{ secrets.KCISA_KEY_LINKED }}
          KCISA_KEY_LOST: ${{ secrets.KCISA_KEY_LOST }}
          KCISA_KEY_PERF: ${{ secrets.KCISA_KEY_PERF }}
          RECHECK_ALERT_FILE: ${{ runner.temp }}/recheck_alert.txt
        run: node tools/recheck.js
      - name: 바뀐 신뢰도 카드 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trust.json
          git diff --cached --quiet || (git commit -m "KSPO API 자동 재검사" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 확인 실패 알림
        if: github.event_name != 'push'
        run: |
          if [ -f "${{ runner.temp }}/recheck_alert.txt" ]; then
            echo "::error::KSPO API 재검사 중 확인하지 못한 API가 있습니다"
            cat "${{ runner.temp }}/recheck_alert.txt"
            exit 1
          fi
